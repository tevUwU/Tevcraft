<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TevCraft 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#78bce8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block}
#top{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;color:white;text-shadow:0 2px 4px #234}
.logo{font-weight:900;font-size:20px;letter-spacing:1px;background:#c62828;padding:7px 12px;border-radius:12px;box-shadow:0 3px 0 #7f1717}
#hint{font-size:12px;background:#17354caa;padding:7px 10px;border-radius:10px}
#controls{position:fixed;inset:0;pointer-events:none}
.pad{position:absolute;bottom:22px;left:18px;display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:5px;pointer-events:auto}
button{border:1px solid #ffffff88;background:#17354ccc;color:#fff;border-radius:13px;font-size:22px;font-weight:800;touch-action:none;box-shadow:0 3px 0 #10293b}
.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}
.actions{position:absolute;right:18px;bottom:26px;display:flex;flex-direction:column;gap:10px;pointer-events:auto}
.actions button{min-width:86px;padding:12px 10px;font-size:14px}
#bar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px;pointer-events:auto}
.slot{width:38px;height:38px;border:2px solid #ffffff88;border-radius:8px;background:#17354ccc;display:grid;place-items:center;font-size:20px}
.slot.active{border:3px solid #ffe66d;transform:translateY(-5px)}
#toast{position:fixed;top:66px;left:50%;transform:translateX(-50%);background:#17354ddd;color:white;padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#cross{position:fixed;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%);pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 1px 2px #000}
#cross:before{width:2px;height:16px;left:7px}#cross:after{height:2px;width:16px;top:7px}
@media(min-width:800px){.pad{opacity:.8}.actions{right:28px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="top"><div class="logo">TEVCRAFT</div><div id="hint">Drag to look • Move • Mine • Build</div></div>
<div id="toast"></div><div id="cross"></div>
<div id="controls">
 <div class="pad">
  <button data-move="forward">▲</button><button data-move="left">◀</button><button data-move="back">▼</button><button data-move="right">▶</button>
 </div>
 <div class="actions"><button id="jump">JUMP</button><button id="mine">MINE ⛏</button><button id="place">PLACE ▣</button></div>
</div>
<div id="bar"><div class="slot active">🟩</div><div class="slot">🟫</div><div class="slot">🪨</div><div class="slot">🪵</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const host=document.getElementById('game');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x82c9f0);scene.fog=new THREE.Fog(0x82c9f0,18,48);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdaf3ff,0x5c7044,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-8,16,10);sun.castShadow=true;scene.add(sun);
const mats={grass:new THREE.MeshLambertMaterial({color:0x56a83c}),dirt:new THREE.MeshLambertMaterial({color:0x86502c}),stone:new THREE.MeshLambertMaterial({color:0x858b91}),wood:new THREE.MeshLambertMaterial({color:0x98602f}),leaf:new THREE.MeshLambertMaterial({color:0x287d35}),sand:new THREE.MeshLambertMaterial({color:0xd8c17b})};
const geo=new THREE.BoxGeometry(1,1,1), blocks=new Map(), group=new THREE.Group();scene.add(group);
const key=(x,y,z)=>`${x},${y},${z}`;
function addBlock(x,y,z,type='grass'){const k=key(x,y,z);if(blocks.has(k))return;const m=new THREE.Mesh(geo,mats[type]||mats.grass);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;m.userData={x,y,z,type};group.add(m);blocks.set(k,m)}
function removeBlock(x,y,z){const k=key(x,y,z),m=blocks.get(k);if(m){group.remove(m);mats[m.userData.type]?.dispose?.();blocks.delete(k)}}
for(let x=-13;x<=13;x++)for(let z=-13;z<=13;z++){let h=Math.floor(Math.sin(x*.32)*1.1+Math.cos(z*.28)*.9);for(let y=-2;y<=h;y++)addBlock(x,y,z,y===h?'grass':'dirt');if((x*x+z*z)>15&&Math.random()<.045){for(let y=1;y<=3;y++)addBlock(x,h+y,z,'wood');for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)for(let dy=2;dy<=4;dy++)if(Math.random()>.16)addBlock(x+dx,h+dy,z+dz,'leaf');}}
const water=new THREE.Mesh(new THREE.PlaneGeometry(18,18),new THREE.MeshLambertMaterial({color:0x299bd0,transparent:true,opacity:.72}));water.rotation.x=-Math.PI/2;water.position.set(0,-.35,0);scene.add(water);
const player=new THREE.Group();scene.add(player);const body=new THREE.Mesh(new THREE.BoxGeometry(.65,.9,.38),new THREE.MeshLambertMaterial({color:0xc62828}));body.position.y=.95;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.BoxGeometry(.58,.58,.58),new THREE.MeshLambertMaterial({color:0xf0c49b}));head.position.y=1.7;head.castShadow=true;player.add(head);const hair=new THREE.Mesh(new THREE.BoxGeometry(.6,.18,.6),new THREE.MeshLambertMaterial({color:0x38251c}));hair.position.y=2.04;player.add(hair);player.position.set(0,1,5);
let yaw=0,pitch=-.18,vy=0,onGround=false,selected='grass';const keys={};let look=false,lastX=0,lastY=0;
function updateCamera(){camera.position.set(player.position.x-Math.sin(yaw)*5,player.position.y+3.2-pitch*2,player.position.z-Math.cos(yaw)*5);camera.lookAt(player.position.x,player.position.y+1.15,player.position.z)}
renderer.domElement.addEventListener('pointerdown',e=>{look=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!look)return;yaw-=(e.clientX-lastX)*.006;pitch=Math.max(-.7,Math.min(.65,pitch+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY});
renderer.domElement.addEventListener('pointerup',()=>look=false);
document.querySelectorAll('[data-move]').forEach(b=>{const k=b.dataset.move;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
document.getElementById('jump').addEventListener('pointerdown',()=>{if(onGround){vy=7;onGround=false}});
const ray=new THREE.Raycaster();
function target(){ray.setFromCamera(new THREE.Vector2(0,0),camera);return ray.intersectObjects([...blocks.values()],false)[0]}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.opacity=0,1300)}
document.getElementById('mine').onclick=()=>{const hit=target();if(hit){const p=hit.object.position;removeBlock(p.x,p.y,p.z);toast('Block mined!')}};
document.getElementById('place').onclick=()=>{const hit=target();if(hit){const p=hit.object.position,n=hit.face.normal;const x=Math.round(p.x+n.x),y=Math.round(p.y+n.y),z=Math.round(p.z+n.z);if(Math.abs(x-player.position.x)>0.8||Math.abs(z-player.position.z)>0.8||y>player.position.y+2)addBlock(x,y,z,selected);toast('Block placed!')}};
document.querySelectorAll('.slot').forEach((s,i)=>s.onclick=()=>{document.querySelectorAll('.slot').forEach(v=>v.classList.remove('active'));s.classList.add('active');selected=['grass','dirt','stone','wood'][i]});
window.addEventListener('keydown',e=>{if(e.key==='w'||e.key==='ArrowUp')keys.forward=true;if(e.key==='s'||e.key==='ArrowDown')keys.back=true;if(e.key==='a'||e.key==='ArrowLeft')keys.left=true;if(e.key==='d'||e.key==='ArrowRight')keys.right=true;if(e.code==='Space'&&onGround){vy=7;onGround=false}});
window.addEventListener('keyup',e=>{if(['w','ArrowUp'].includes(e.key))keys.forward=false;if(['s','ArrowDown'].includes(e.key))keys.back=false;if(['a','ArrowLeft'].includes(e.key))keys.left=false;if(['d','ArrowRight'].includes(e.key))keys.right=false});
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);const forward=(keys.forward?1:0)-(keys.back?1:0),side=(keys.right?1:0)-(keys.left?1:0);const speed=5;player.position.x+=(Math.sin(yaw)*forward+Math.cos(yaw)*side)*speed*dt;player.position.z+=(Math.cos(yaw)*forward-Math.sin(yaw)*side)*speed*dt;player.position.x=Math.max(-12,Math.min(12,player.position.x));player.position.z=Math.max(-12,Math.min(12,player.position.z));vy-=18*dt;player.position.y+=vy*dt;if(player.position.y<1){player.position.y=1;vy=0;onGround=true}updateCamera();renderer.render(scene,camera)}
animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
toast('Welcome to TevCraft 3D!');
</script>
</body></html>
