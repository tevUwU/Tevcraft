<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TevCraft V6.1</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#87ceeb;touch-action:none}
canvas{display:block}
#logo{position:fixed;top:12px;left:12px;background:#c62828;color:white;padding:9px 14px;border-radius:12px;font-weight:bold;z-index:2}
#cross{position:fixed;left:50%;top:50%;color:white;font-size:25px;transform:translate(-50%,-50%);z-index:2;text-shadow:1px 1px #000;pointer-events:none}
#joystick{position:fixed;left:24px;bottom:24px;width:138px;height:138px;border-radius:50%;background:#17354c66;border:3px solid #ffffffaa;z-index:4;touch-action:none;display:flex;align-items:center;justify-content:center}
#stick{width:62px;height:62px;border-radius:50%;background:#dceaf2dd;border:3px solid #ffffff;box-shadow:0 3px 10px #0006;transform:translate(0,0);pointer-events:none}
.actions{position:fixed;bottom:25px;right:15px;z-index:3;display:flex;flex-direction:column;gap:8px}
button{background:#17354cdd;color:white;border:2px solid #ffffff88;border-radius:13px;font-weight:bold;font-size:16px;padding:13px 15px;touch-action:none}
.hand{position:fixed;right:0;bottom:55px;width:95px;height:120px;background:#d49a6a;border:4px solid #754b31;border-radius:20px 0 0 0;transform:rotate(-15deg);z-index:1;pointer-events:none}
@media(max-width:500px){#joystick{width:128px;height:128px;left:18px;bottom:18px}#stick{width:58px;height:58px}.actions{right:12px;bottom:18px}}
</style>
</head>
<body>
<div id="logo">TEVCRAFT V6.1 🕹️</div>
<div id="cross">+</div>
<div class="hand"></div>
<div id="joystick" aria-label="Movement joystick"><div id="stick"></div></div>
<div class="actions"><button id="mine">MINE ⛏️</button><button id="place">PLACE 🧱</button></div>
<script type="module">
import * as T from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
const s=new T.Scene();
s.background=new T.Color(0x87ceeb);
s.fog=new T.Fog(0x87ceeb,18,45);
const c=new T.PerspectiveCamera(75,innerWidth/innerHeight,.1,100);
const r=new T.WebGLRenderer({antialias:true});
r.setSize(innerWidth,innerHeight);
r.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.prepend(r.domElement);
s.add(new T.HemisphereLight(0xffffff,0x506040,2));
let sun=new T.DirectionalLight(0xffffff,2);
sun.position.set(8,15,8);s.add(sun);
const mat={
 g:new T.MeshLambertMaterial({color:0x4fa83b}),
 d:new T.MeshLambertMaterial({color:0x81502e}),
 w:new T.MeshLambertMaterial({color:0x8b5a32}),
 leaf:new T.MeshLambertMaterial({color:0x287c35})
};
const geo=new T.BoxGeometry(1,1,1),grp=new T.Group(),blocks=[];
s.add(grp);
function add(x,y,z,m){let q=new T.Mesh(geo,mat[m]);q.position.set(x,y,z);grp.add(q);blocks.push(q)}
for(let x=-12;x<=12;x++)for(let z=-12;z<=12;z++){
 let h=Math.floor(Math.sin(x*.3)+Math.cos(z*.25));
 for(let y=-2;y<=h;y++)add(x,y,z,y==h?'g':'d');
 if(Math.random()<.025&&Math.abs(x)+Math.abs(z)>8){
  for(let y=1;y<4;y++)add(x,h+y,z,'w');
  for(let dx=-1;dx<2;dx++)for(let dz=-1;dz<2;dz++)add(x+dx,h+4,z+dz,'leaf');
 }
}
let p=new T.Vector3(0,2,5),yaw=0,pitch=0,down=false,lx,ly;
let moveX=0,moveY=0;
function cam(){c.position.copy(p);c.rotation.order='YXZ';c.rotation.y=yaw;c.rotation.x=pitch}
r.domElement.addEventListener('pointerdown',e=>{down=true;lx=e.clientX;ly=e.clientY;r.domElement.setPointerCapture(e.pointerId)});
r.domElement.addEventListener('pointermove',e=>{
 if(!down)return;
 yaw-=(e.clientX-lx)*.006;
 pitch=Math.max(-1.2,Math.min(1.2,pitch-(e.clientY-ly)*.006));
 lx=e.clientX;ly=e.clientY;
});
function stopLook(){down=false}
r.domElement.addEventListener('pointerup',stopLook);
r.domElement.addEventListener('pointercancel',stopLook);

// Roblox-style virtual joystick
const joy=document.getElementById('joystick');
const stick=document.getElementById('stick');
const radius=43;
let joyPointer=null;
function updateJoystick(e){
 const rect=joy.getBoundingClientRect();
 const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy;
 const len=Math.hypot(dx,dy);
 if(len>radius){dx=dx/len*radius;dy=dy/len*radius}
 moveX=dx/radius;
 moveY=-dy/radius;
 stick.style.transform=`translate(${dx}px,${dy}px)`;
}
function resetJoystick(){
 joyPointer=null;moveX=0;moveY=0;
 stick.style.transform='translate(0px,0px)';
}
joy.addEventListener('pointerdown',e=>{
 e.preventDefault();e.stopPropagation();
 joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);updateJoystick(e);
});
joy.addEventListener('pointermove',e=>{
 if(e.pointerId!==joyPointer)return;
 e.preventDefault();updateJoystick(e);
});
joy.addEventListener('pointerup',e=>{if(e.pointerId===joyPointer)resetJoystick()});
joy.addEventListener('pointercancel',resetJoystick);
joy.addEventListener('lostpointercapture',resetJoystick);

let ray=new T.Raycaster();
function target(){ray.setFromCamera(new T.Vector2(0,0),c);return ray.intersectObjects(blocks,false)[0]}
document.getElementById('mine').onclick=()=>{
 let h=target();if(h){grp.remove(h.object);blocks.splice(blocks.indexOf(h.object),1)}
};
document.getElementById('place').onclick=()=>{
 let h=target();if(h){let q=h.object.position,n=h.face.normal;add(Math.round(q.x+n.x),Math.round(q.y+n.y),Math.round(q.z+n.z),'g')}
};
let last=performance.now();
function loop(t){
 requestAnimationFrame(loop);
 let d=(t-last)/1000;last=t;
 // Joystick up moves forward; left/right strafe relative to camera direction.
 let f=moveY,q=moveX;
 const speed=5;
 p.x+=(Math.sin(yaw)*f+Math.cos(yaw)*q)*speed*d;
 p.z+=(Math.cos(yaw)*f-Math.sin(yaw)*q)*speed*d;
 p.x=Math.max(-11,Math.min(11,p.x));
 p.z=Math.max(-11,Math.min(11,p.z));
 p.y=2;cam();r.render(s,c);
}
requestAnimationFrame(loop);
onresize=()=>{
 c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);
};
</script>
</body>
</html>
