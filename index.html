<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TevCraft V6</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Arial;background:#87ceeb;touch-action:none}canvas{display:block}#logo{position:fixed;top:12px;left:12px;background:#c62828;color:white;padding:9px 14px;border-radius:12px;font-weight:bold;z-index:2}#cross{position:fixed;left:50%;top:50%;color:white;font-size:25px;transform:translate(-50%,-50%);z-index:2;text-shadow:1px 1px #000}.pad{position:fixed;bottom:20px;left:15px;z-index:3;display:grid;grid-template-columns:55px 55px 55px;gap:5px}.pad button{height:52px}.up{grid-column:2}.actions{position:fixed;bottom:25px;right:15px;z-index:3;display:flex;flex-direction:column;gap:8px}button{background:#17354cdd;color:white;border:2px solid #ffffff88;border-radius:13px;font-weight:bold;font-size:16px;touch-action:none}.hand{position:fixed;right:0;bottom:55px;width:95px;height:120px;background:#d49a6a;border:4px solid #754b31;border-radius:20px 0 0 0;transform:rotate(-15deg);z-index:1;pointer-events:none}</style></head><body><div id="logo">TEVCRAFT V6 👀</div><div id="cross">+</div><div class="hand"></div><div class="pad"><button class="up" id="f">▲</button><button id="l">◀</button><button id="b">▼</button><button id="r">▶</button></div><div class="actions"><button id="mine">MINE ⛏️</button><button id="place">PLACE 🧱</button></div><script type="module">import*as T from"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";const s=new T.Scene();s.background=new T.Color(0x87ceeb);s.fog=new T.Fog(0x87ceeb,18,45);const c=new T.PerspectiveCamera(75,innerWidth/innerHeight,.1,100),r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.prepend(r.domElement);s.add(new T.HemisphereLight(0xffffff,0x506040,2));let sun=new T.DirectionalLight(0xffffff,2);sun.position.set(8,15,8);s.add(sun);const mat={g:new T.MeshLambertMaterial({color:0x4fa83b}),d:new T.MeshLambertMaterial({color:0x81502e}),w:new T.MeshLambertMaterial({color:0x8b5a32}),leaf:new T.MeshLambertMaterial({color:0x287c35})},geo=new T.BoxGeometry(1,1,1),grp=new T.Group(),blocks=[];s.add(grp);function add(x,y,z,m){let q=new T.Mesh(geo,mat[m]);q.position.set(x,y,z);grp.add(q);blocks.push(q)}for(let x=-12;x<=12;x++)for(let z=-12;z<=12;z++){let h=Math.floor(Math.sin(x*.3)+Math.cos(z*.25));for(let y=-2;y<=h;y++)add(x,y,z,y==h?'g':'d');if(Math.random()<.025&&Math.abs(x)+Math.abs(z)>8){for(let y=1;y<4;y++)add(x,h+y,z,'w');for(let dx=-1;dx<2;dx++)for(let dz=-1;dz<2;dz++)add(x+dx,h+4,z+dz,'leaf')}}let p=new T.Vector3(0,2,5),yaw=0,pitch=0,down=false,lx,ly,mv={f:0,b:0,l:0,r:0};function cam(){c.position.copy(p);c.rotation.order='YXZ';c.rotation.y=yaw;c.rotation.x=pitch}r.domElement.onpointerdown=e=>{down=1;lx=e.clientX;ly=e.clientY};r.domElement.onpointermove=e=>{if(!down)return;yaw-=(e.clientX-lx)*.006;pitch=Math.max(-1.2,Math.min(1.2,pitch-(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY};r.domElement.onpointerup=()=>down=0;for(let [id,k] of [['f','f'],['b','b'],['l','l'],['r','r']]){let e=document.getElementById(id);e.onpointerdown=a=>{a.preventDefault();mv[k]=1};e.onpointerup=e.onpointerleave=()=>mv[k]=0}let ray=new T.Raycaster();function target(){ray.setFromCamera(new T.Vector2(0,0),c);return ray.intersectObjects(blocks,false)[0]}document.getElementById('mine').onclick=()=>{let h=target();if(h){grp.remove(h.object);blocks.splice(blocks.indexOf(h.object),1)}};document.getElementById('place').onclick=()=>{let h=target();if(h){let q=h.object.position,n=h.face.normal;add(Math.round(q.x+n.x),Math.round(q.y+n.y),Math.round(q.z+n.z),'g')}};let last=performance.now();function loop(t){requestAnimationFrame(loop);let d=(t-last)/1000;last=t;let f=mv.f-mv.b,q=mv.r-mv.l;p.x+=(Math.sin(yaw)*f+Math.cos(yaw)*q)*5*d;p.z+=(Math.cos(yaw)*f-Math.sin(yaw)*q)*5*d;p.x=Math.max(-11,Math.min(11,p.x));p.z=Math.max(-11,Math.min(11,p.z));p.y=2;cam();r.render(s,c)}requestAnimationFrame(loop);onresize=()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)}</script></body></html>
